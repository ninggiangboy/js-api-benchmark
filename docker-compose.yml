services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports: ["5432:5432"]
    command: >
      postgres -c max_connections=300 -c shared_buffers=1GB -c synchronous_commit=off
      -c fsync=off -c full_page_writes=off -c random_page_cost=1.1
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
